spring.application.name=bp-sugar-monitor

spring.datasource.url=jdbc:h2:mem:monitordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Uncomment for a persistent file-based DB (replace path as needed)
# spring.datasource.url=jdbc:h2:file:./data/monitordb;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 console (dev only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Logging (optional, useful while developing) ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
