<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Access Code</title>
  <style>
    body{font-family:Inter,system-ui,Arial,Helvetica,sans-serif;background:#0f2027;color:#ecf0f1;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .box{background:rgba(255,255,255,0.04);padding:28px;border-radius:10px;max-width:420px;width:100%;box-shadow:0 6px 18px rgba(0,0,0,0.5)}
    h2{margin:0 0 12px 0}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;margin-bottom:12px;font-size:1rem}
    .btn{display:inline-block;padding:8px 12px;border-radius:8px;background:#FF7A59;color:#102a43;font-weight:700;border:0;cursor:pointer}
    .error{color:#ffb3b3;margin-bottom:8px}
    .hint{color:#b8c2c9;font-size:0.9rem;margin-top:8px}
  </style>
</head>
<body>
<div class="box">
  <h2>Enter Access Code</h2>
  <form th:action="@{/login}" method="post">
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <input type="password" name="code" placeholder="Enter code" required autofocus />
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn" type="submit">Open</button>
      <a th:href="@{/logout}" style="color:var(--muted);text-decoration:none;margin-left:8px">Reset</a>
    </div>
  </form>
  <div class="hint">Enter the default code to access data.</div>
</div>
</body>
</html>
