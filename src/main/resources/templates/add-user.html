<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Add User</title>
    <style>
        body {
            font-family: Inter, system-ui, Arial, Helvetica, sans-serif;
            background: #0f2027;
            color: #ecf0f1;
            padding: 24px;
        }
        .card {
            background: #071426;
            padding: 20px;
            border-radius: 8px;
            max-width: 420px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 6px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: inherit;
            appearance: none; /* Removes default arrow for better styling */
            cursor: pointer;
            font-size: 1rem;
        }
        /* Custom arrow for select dropdown */
        select {
            background-image: linear-gradient(45deg, transparent 50%, #ecf0f1 50%),
                              linear-gradient(135deg, #ecf0f1 50%, transparent 50%);
            background-position: calc(100% - 20px) calc(1em + 2px),
                                 calc(100% - 15px) calc(1em + 2px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }
        select:hover, select:focus {
            border-color: #ff7a59;
            outline: none;
            background-color: rgba(255, 122, 89, 0.1);
        }
        .btn {
            background: #FF7A59;
            color: #102a43;
            padding: 8px 12px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background: #ff4a3a;
        }
        a {
            align-self: center;
            color: #b8c2c9;
            text-decoration: none;
            padding: 8px 12px;
            font-size: 1rem;
        }
        a:hover {
            text-decoration: underline;
            color: #ff7a59;
        }
        div[style*="display:flex"] {
            display: flex;
            gap: 8px;
            justify-content: flex-start;
            align-items: center;
        }
        .btn:hover {
    background: #ff4a3a; /* Keep vibrant accent color */
    color: #102a43;      /* Ensure text stays dark and visible */
}

a:hover {
    text-decoration: underline;
    color: #ff7a59;      /* Bright accent color for links */
    background: transparent; /* Remove any background */
}
    </style>
</head>
<body>
<div class="card">
    <h2>Add User</h2>
    <form th:action="@{/users/add}" method="post">
        <input type="text" name="name" placeholder="Name" required />
        <input type="number" name="age" placeholder="Age" />
        <select name="gender">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <div style="display:flex;gap:8px">
            <button class="btn" type="submit">Save</button>
            <a th:href="@{/main}" style="align-self:center;color:#b8c2c9;text-decoration:none">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
